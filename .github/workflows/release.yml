name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
  workflow_dispatch:

jobs:

  # ── Build all packages once, upload as artifacts ─────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from version.json
        id: version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - name: Build all module packages
        run: |
          chmod +x ./build.sh
          ./build.sh Pf2eNpcMaker DnD5eNpcMaker Hero6eNpcMaker Pf2eItemGenerator Dnd5eItemGenerator Pf2eNationsAndCitiesMaker Pf2eCalendarTimeline

      - name: Inject version + manifest URLs into each module.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          inject() {
            local NAME="$1"
            local REPO="${2:-$1}"
            local BASE="https://github.com/JamesCfer/${REPO}/releases/download"
            jq \
              --arg version  "$VERSION" \
              --arg manifest "${BASE}/latest/module.json" \
              --arg download "${BASE}/latest/${NAME}.zip" \
              '.version=$version | .manifest=$manifest | .download=$download' \
              "${NAME}/module.json" > "${NAME}/module.json.tmp"
            mv "${NAME}/module.json.tmp" "${NAME}/module.json"
          }

          inject Pf2eNpcMaker
          inject DnD5eNpcMaker
          inject Hero6eNpcMaker
          inject Pf2eItemGenerator Pf2eItemMaker
          inject Dnd5eItemGenerator D-Ditemmaker
          inject Pf2eNationsAndCitiesMaker
          inject Pf2eCalendarTimeline

      - name: Zip all module packages
        run: |
          zip -r Pf2eNpcMaker.zip               Pf2eNpcMaker/
          zip -r DnD5eNpcMaker.zip              DnD5eNpcMaker/
          zip -r Hero6eNpcMaker.zip             Hero6eNpcMaker/
          zip -r Pf2eItemGenerator.zip          Pf2eItemGenerator/
          zip -r Dnd5eItemGenerator.zip         Dnd5eItemGenerator/
          zip -r Pf2eNationsAndCitiesMaker.zip  Pf2eNationsAndCitiesMaker/
          zip -r Pf2eCalendarTimeline.zip       Pf2eCalendarTimeline/

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          retention-days: 2
          path: |
            version.json
            Pf2eNpcMaker/
            DnD5eNpcMaker/
            Hero6eNpcMaker/
            Pf2eItemGenerator/
            Dnd5eItemGenerator/
            Pf2eNationsAndCitiesMaker/
            Pf2eCalendarTimeline/
            Pf2eNpcMaker.zip
            DnD5eNpcMaker.zip
            Hero6eNpcMaker.zip
            Pf2eItemGenerator.zip
            Dnd5eItemGenerator.zip
            Pf2eNationsAndCitiesMaker.zip
            Pf2eCalendarTimeline.zip

  # ── Release 1 of 5: Pf2eNpcMaker (immediate) ─────────────────────────────────
  release-pf2e-npc:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - name: Push source to Pf2eNpcMaker
        env:
          MODULES_PAT: ${{ secrets.MODULES_RELEASE_PAT }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf _pf2e_repo
          git clone https://x-access-token:${MODULES_PAT}@github.com/JamesCfer/Pf2eNpcMaker.git _pf2e_repo
          rsync -a --exclude=.git --delete Pf2eNpcMaker/ _pf2e_repo/
          cd _pf2e_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Release v${VERSION}"
          git push -u origin HEAD

      - name: Create Pf2eNpcMaker versioned release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MODULES_RELEASE_PAT }}
          script: |
            const fs = require('fs');
            const owner = 'JamesCfer';
            const repo = 'Pf2eNpcMaker';
            const version = '${{ steps.version.outputs.version }}';
            const tag = `v${version}`;

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              for (const asset of release.assets)
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            } catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `v${version}`,
                body: `Pf2eNpcMaker v${version}`, draft: false, prerelease: false,
              })).data;
            }
            for (const [name, path] of [['module.json', 'Pf2eNpcMaker/module.json'], ['Pf2eNpcMaker.zip', 'Pf2eNpcMaker.zip']])
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data: fs.readFileSync(path) });

      - name: Update Pf2eNpcMaker latest release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MODULES_RELEASE_PAT }}
          script: |
            const fs = require('fs');
            const owner = 'JamesCfer';
            const repo = 'Pf2eNpcMaker';
            const tag = 'latest';
            const version = '${{ steps.version.outputs.version }}';

            const list = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            let release = list.data.find(r => r.tag_name === tag);
            if (release) {
              for (const asset of release.assets)
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id,
                name: `latest (v${version})`,
                body: `Always points to the latest release. Current: v${version}`,
              });
            } else {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `latest (v${version})`,
                body: `Always points to the latest release. Current: v${version}`,
                draft: false, prerelease: false,
              })).data;
            }
            for (const [name, path] of [['module.json', 'Pf2eNpcMaker/module.json'], ['Pf2eNpcMaker.zip', 'Pf2eNpcMaker.zip']])
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data: fs.readFileSync(path) });

      - name: Notify Foundry PF2e NPC Package
        env:
          FOUNDRYVTT_RELEASE_TOKEN: ${{ secrets.FOUNDRYVTT_RELEASE_TOKEN }}
        run: |
          # Retry on transient Foundry API errors (429 rate limit, 5xx) with
          # exponential backoff so a momentary 429 doesn't fail the release and
          # block all downstream staggered releases.
          notify_foundry() {
            local token="$1" payload="$2"
            local attempt=1 max_attempts=5 delay=15
            while :; do
              local response http_code body
              response=$(curl -s -w "\n%{http_code}" -X POST https://foundryvtt.com/_api/packages/release_version/ \
                -H "Content-Type: application/json" \
                -H "Authorization: ${token}" \
                -d "$payload")
              http_code=$(echo "$response" | tail -1)
              body=$(echo "$response" | head -n -1)
              echo "Attempt ${attempt}/${max_attempts} — HTTP status: $http_code"
              echo "Response body: $body"
              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                echo "Foundry VTT release published."
                return 0
              fi
              if { [ "$http_code" -eq 429 ] || [ "$http_code" -ge 500 ]; } && [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient error (HTTP $http_code). Retrying in ${delay}s..."
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
                continue
              fi
              echo "ERROR: Foundry VTT API returned HTTP $http_code"
              return 1
            done
          }
          VERSION="${{ steps.version.outputs.version }}"
          PAYLOAD="{
              \"id\": \"Pf2eNpcMaker\",
              \"dry-run\": false,
              \"release\": {
                \"version\": \"${VERSION}\",
                \"manifest\": \"https://github.com/JamesCfer/Pf2eNpcMaker/releases/download/latest/module.json\",
                \"notes\": \"https://github.com/JamesCfer/Pf2eNpcMaker/releases/tag/v${VERSION}\",
                \"compatibility\": {
                  \"minimum\": \"13\",
                  \"verified\": \"13\"
                }
              }
            }"
          notify_foundry "$FOUNDRYVTT_RELEASE_TOKEN" "$PAYLOAD"

