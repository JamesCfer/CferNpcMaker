            for (const [name, path] of [['module.json', 'Pf2eItemGenerator/module.json'], ['Pf2eItemGenerator.zip', 'Pf2eItemGenerator.zip']])
              await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: release.id, name, data: fs.readFileSync(path) });

      - name: Notify Foundry PF2e Item Generator Package
        env:
          FOUNDRYVTT_PF2E_ITEM_RELEASE_TOKEN: ${{ secrets.FOUNDRYVTT_PF2E_ITEM_RELEASE_TOKEN }}
        run: |
          # Retry on transient Foundry API errors (429 rate limit, 5xx) with
          # exponential backoff so a momentary 429 doesn't fail the release.
          notify_foundry() {
            local token="$1" payload="$2"
            local attempt=1 max_attempts=5 delay=15
            while :; do
              local response http_code body
              response=$(curl -s -w "\n%{http_code}" -X POST https://foundryvtt.com/_api/packages/release_version/ \
                -H "Content-Type: application/json" \
                -H "Authorization: ${token}" \
                -d "$payload")
              http_code=$(echo "$response" | tail -1)
              body=$(echo "$response" | head -n -1)
              echo "Attempt ${attempt}/${max_attempts} — HTTP status: $http_code"
              echo "Response body: $body"
              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
                echo "Foundry VTT release published."
                return 0
              fi
              if { [ "$http_code" -eq 429 ] || [ "$http_code" -ge 500 ]; } && [ "$attempt" -lt "$max_attempts" ]; then
                echo "Transient error (HTTP $http_code). Retrying in ${delay}s..."
                sleep "$delay"
                attempt=$((attempt + 1))
                delay=$((delay * 2))
                continue
              fi
              echo "ERROR: Foundry VTT API returned HTTP $http_code"
              return 1
            done
          }
          VERSION="${{ steps.version.outputs.version }}"
          PAYLOAD="{
              \"id\": \"PF2E-Item-Generator\",
              \"dry-run\": false,
              \"release\": {
                \"version\": \"${VERSION}\",
                \"manifest\": \"https://github.com/JamesCfer/Pf2eItemMaker/releases/download/latest/module.json\",
                \"notes\": \"https://github.com/JamesCfer/Pf2eItemMaker/releases/tag/v${VERSION}\",
                \"compatibility\": {
                  \"minimum\": \"13\",
                  \"verified\": \"13\"
                }
              }
            }"
          notify_foundry "$FOUNDRYVTT_PF2E_ITEM_RELEASE_TOKEN" "$PAYLOAD"

