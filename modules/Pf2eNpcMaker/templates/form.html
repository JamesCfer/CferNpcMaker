      <form class="npc-form" autocomplete="off">

        <div class="history-selected-banner" style="display:none;">
          <i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i>
          <span class="history-selected-label">Editing prompt from <strong></strong> — update fields and Generate to recreate</span>
        </div>

        <div class="field-row">
          <div class="field field--name">
            <label for="npc-name">NPC Name</label>
            <input type="text" id="npc-name" name="name" placeholder="e.g. Goblin Warchief" />
          </div>
          <div class="field field--level">
            <label for="npc-level">Level</label>
            <input type="number" id="npc-level" name="level" value="1" min="0" max="25" step="1" />
          </div>
        </div>

        <div class="field">
          <label for="npc-desc">Description</label>
          <select class="desc-template-select" aria-label="Load a description template">
            <option value="">— Quick template… —</option>
            <option value="A stalwart town guard on patrol: well-trained in basic combat, loyal to the city watch. Equipped with leather armor, a spear, and a short sword. Stern but fair; follows orders without question and calls for backup before engaging threats alone.">Town guard</option>
            <option value="A traveling merchant with sharp eyes and a sharper tongue. Carries a light crossbow beneath the counter. Knows the value of everything and the price of everyone. Willing to deal, but never at a loss.">Merchant</option>
            <option value="A charismatic cult leader who commands fanatical devotion through a mix of enchantment magic and inspiring oratory. Speaks in riddles, always alluding to a higher power. Utterly calm under pressure, ruthless when followers fail.">Cult leader</option>
            <option value="A scarred bandit captain who leads a ruthless gang of outlaws. Dual-wields scimitars and fights dirty. Opportunistic and brutal, but surprisingly loyal to those who earn their trust.">Bandit captain</option>
            <option value="A grizzled veteran soldier: decades of warfare have left them tough and tactically brilliant. Heavy armor, a scarred greatsword. Follows a strict code of honor even when the enemy does not.">Veteran soldier</option>
            <option value="An eccentric sage and spell-crafter who hoards arcane knowledge. Carries a twisted staff and a bulging spellbook. Speaks in long digressions, forgets names but never facts, and is mildly annoyed by everything.">Sage</option>
            <option value="A skulking assassin for hire: quiet, precise, and entirely without conscience. Prefers a poisoned blade in the back over a fair fight. Takes pride in leaving no witnesses.">Assassin</option>
          </select>
          <textarea id="npc-desc" name="description" rows="5"
            placeholder="Describe this NPC: their role, fighting style, special abilities, equipment, personality traits…"></textarea>
          <span class="field-hint">The more detail you provide, the better the AI can match your vision.</span>
        </div>

        <div class="field field--check">
          <label class="checkbox-label">
            <input type="checkbox" name="includeSpells" />
            <span>Include spell compendium mapping</span>
          </label>
          <span class="field-hint">Indexes your spell compendiums before generating (~10 s extra, enables correct spell links).</span>
        </div>

        <div class="field field--creativity">
          <label for="npc-creativity">Creativity <output class="creativity-value-display" for="npc-creativity">0.50</output></label>
          <input type="range" id="npc-creativity" name="creativity" min="0" max="1" step="0.05" value="0.5" />
          <div class="creativity-labels" aria-hidden="true"><span>Precise</span><span>Creative</span></div>
        </div>

        <div class="form-actions">
          <button type="button" data-action="generate" class="btn-primary" disabled>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span class="btn-label">Generate NPC</span>
          </button>
          <label class="bulk-count-label" title="Generate this many NPCs at once (1–5)">
            ×<input type="number" name="bulkCount" class="bulk-count-input" value="1" min="1" max="5" step="1" aria-label="Bulk count" />
          </label>
          <button type="button" data-action="export" class="btn-secondary" disabled>
            <i class="fa-solid fa-file-arrow-down"></i>
            <span>Export JSON</span>
          </button>
        </div>

        <div class="form-actions form-actions--image">
          <button type="button" data-action="generateimage" class="btn-image" disabled>
            <i class="fa-solid fa-image"></i>
            <span>Generate NPC Image</span>
            <span class="btn-cost-badge">4 uses</span>
          </button>
        </div>

      </form>
