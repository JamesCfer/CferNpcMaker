      <form class="npc-form" autocomplete="off">

        <div class="history-selected-banner" style="display:none;">
          <i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i>
          <span class="history-selected-label">Editing prompt from <strong></strong> — update fields and Generate to recreate</span>
        </div>

        <div class="field-row">
          <div class="field field--name">
            <label for="npc-name">Item Name</label>
            <input type="text" id="npc-name" name="name" placeholder="e.g. Cloak of the Shadowfell" />
          </div>
          <div class="field field--level">
            <label for="item-rarity">Rarity</label>
            <select id="item-rarity" name="rarity">
              <option value="">Mundane (no magic)</option>
              <option value="common">Common</option>
              <option value="uncommon" selected>Uncommon</option>
              <option value="rare">Rare</option>
              <option value="veryRare">Very Rare</option>
              <option value="legendary">Legendary</option>
              <option value="artifact">Artifact</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="item-type">Item Type</label>
            <select id="item-type" name="itemType">
              <option value="weapon">Weapon</option>
              <option value="equipment">Armor / Equipment</option>
              <option value="consumable">Consumable (potion, scroll, wand…)</option>
              <option value="tool">Tool</option>
              <option value="loot" selected>Wondrous Item / Loot</option>
              <option value="container">Container</option>
            </select>
          </div>
          <div class="field field--level">
            <label for="item-subtype">Subtype <span class="field-hint">(optional)</span></label>
            <input type="text" id="item-subtype" name="subtype" placeholder="e.g. ring, potion, staff" />
          </div>
        </div>

        <div class="field">
          <label for="npc-desc">Description</label>
          <select class="desc-template-select" aria-label="Load a description template">
            <option value="">— Quick template… —</option>
            <option value="A longsword whose blade blazes with golden fire when drawn by a creature of good alignment. Deals 1d6 extra radiant damage on a hit against fiends or undead. Sheds bright light in a 20-foot radius when activated (no action).">Holy longsword</option>
            <option value="A deep-hooded cloak that shifts colour to match the surroundings. While wearing it the bearer has advantage on Stealth checks and can use an action to become invisible until the next attack or spell cast.">Cloak of blending</option>
            <option value="A battered leather journal that writes itself: it records everything the bearer witnesses and can be queried with a command word, returning a short relevant passage. Has 7 charges; regains 1d6+1 at dawn.">Chronicler's journal</option>
            <option value="A pair of iron gauntlets covered in tiny sigils. While wearing them, the bearer's unarmed strikes deal 1d8 bludgeoning damage and count as magical. On a hit the bearer can expend 1 charge (3 total, recharge at dawn) to push the target 10 feet.">Titan's fist gauntlets</option>
            <option value="A silver ring set with a black sapphire. Once per day the wearer can cast misty step as a bonus action. If they teleport into solid matter they are shunted to the nearest empty space and take 2d10 force damage.">Ring of short-step</option>
            <option value="A travel-worn cloak embroidered with subtly shifting ley lines. While wearing it: the bearer always knows true north, cannot become lost by non-magical means, and can use an action to view terrain within 1 mile as if looking down from 100 feet above. Grants advantage on Survival checks to navigate.">Cloak of the cartographer</option>
            <option value="A hooded brass lantern that never needs oil and never gutters out, even in wind or rain. Its light banishes mundane shadows in a 30-foot radius. As an action, the bearer can focus the flame for 1 minute to reveal invisible creatures and objects within that radius until the focus ends.">Everburning lantern</option>
            <option value="A pair of grey-green sealskin boots stitched with knotted cord. While worn, the bearer can walk on any liquid surface as if it were solid ground, and is unaffected by cold from natural water or weather. Once per day as a reaction, the wearer can avoid falling prone from a slip on ice or a wet surface.">Tidewalker boots</option>
          </select>
          <textarea id="npc-desc" name="description" rows="6"
            placeholder="Describe this item: its appearance, magical properties, activation, lore, any class or alignment restrictions…"></textarea>
          <span class="field-hint">The more detail you provide, the better the AI can match your vision.</span>
        </div>

        <div class="form-actions">
          <button type="button" data-action="generate" class="btn-primary" disabled>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span class="btn-label">Generate Item</span>
          </button>
          <button type="button" data-action="export" class="btn-secondary" disabled>
            <i class="fa-solid fa-file-arrow-down"></i>
            <span>Export JSON</span>
          </button>
        </div>

        <div class="form-actions form-actions--image">
          <button type="button" data-action="generateimage" class="btn-image" disabled>
            <i class="fa-solid fa-image"></i>
            <span>Generate Item Image</span>
            <span class="btn-cost-badge">4 uses</span>
          </button>
        </div>

      </form>
