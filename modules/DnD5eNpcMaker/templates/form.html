      <form class="npc-form" autocomplete="off">

        <div class="history-selected-banner" style="display:none;">
          <i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i>
          <span class="history-selected-label">Editing prompt from <strong></strong> — update fields and Generate to recreate</span>
        </div>

        <div class="field-row">
          <div class="field field--name">
            <label for="npc-name">Creature Name</label>
            <input type="text" id="npc-name" name="name" placeholder="e.g. Bandit Captain" />
          </div>
          <div class="field field--level">
            <label for="npc-level">Challenge Rating</label>
            <input type="number" id="npc-level" name="level" value="1" min="0" max="30" step="0.125" />
          </div>
        </div>

        <div class="field">
          <label for="npc-desc">Description</label>
          <select class="desc-template-select" aria-label="Load a description template">
            <option value="">— Quick template… —</option>
            <option value="A disciplined town guard on patrol: trained in spear and shield, wearing chain mail. Loyal to the lord's law. Calls for backup before engaging and defers to ranking officers.">Town guard</option>
            <option value="A wiry bandit captain who commands a ruthless roadside crew. Dual-wields hand axes and fights dirty. Quick to intimidate, slow to trust, but honours deals once made.">Bandit captain</option>
            <option value="A cunning merchant prince with fingers in every trade: bribery, smuggling, and honest business alike. Travels with hired muscle. Affable on the surface, calculating underneath.">Merchant</option>
            <option value="A robed cult fanatic devoted to a dark entity. Uses mind-affecting spells and a sacrificial dagger. Utterly fearless in service to the cause; views death as an honour.">Cult fanatic</option>
            <option value="An arcane scholar who has spent decades studying forbidden magic. Carries a staff of power and several scrolls. Brilliant, arrogant, and dangerously curious about the party.">Archmage</option>
            <option value="A retired war veteran turned tavern keeper: tough, worldly, and still deadly in a brawl. Keeps a war hammer behind the bar. Gruff but protective of regulars.">Veteran innkeeper</option>
            <option value="A cunning spy embedded in the city's power structure. Uses charm, disguise, and a poisoned shortbow. Serves the highest bidder; sells secrets like commodities.">Spy</option>
          </select>
          <textarea id="npc-desc" name="description" rows="5"
            placeholder="Describe this creature: their role, attacks, special abilities, legendary actions, lore…"></textarea>
          <span class="field-hint">The more detail you provide, the better the AI can match your vision.</span>
        </div>

        <div class="field">
          <label for="npc-caster-type">Caster Type</label>
          <select id="npc-caster-type" name="casterType">
            <option value="none">None (martial / non-caster)</option>
            <option value="half">Half Caster (up to 5th-level spells)</option>
            <option value="full">Full Caster (up to 9th-level spells)</option>
          </select>
          <span class="field-hint">Determines spell slot progression included in the stat block.</span>
        </div>

        <div class="field field--creativity">
          <label for="npc-creativity">Creativity <output class="creativity-value-display" for="npc-creativity">0.50</output></label>
          <input type="range" id="npc-creativity" name="creativity" min="0" max="1" step="0.05" value="0.5" />
          <div class="creativity-labels" aria-hidden="true"><span>Precise</span><span>Creative</span></div>
        </div>

        <div class="form-actions">
          <button type="button" data-action="generate" class="btn-primary" disabled>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span class="btn-label">Generate Creature</span>
          </button>
          <button type="button" data-action="export" class="btn-secondary" disabled>
            <i class="fa-solid fa-file-arrow-down"></i>
            <span>Export JSON</span>
          </button>
        </div>

        <div class="form-actions form-actions--image">
          <button type="button" data-action="generateimage" class="btn-image" disabled>
            <i class="fa-solid fa-image"></i>
            <span>Generate Creature Image</span>
            <span class="btn-cost-badge">4 uses</span>
          </button>
        </div>

      </form>
