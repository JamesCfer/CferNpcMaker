<form class="npc-form map-form" autocomplete="off">
  <section class="map-section"><div class="field"><label for="map-description">Description</label><select class="map-template-select" aria-label="Load a map idea"><option value="">— Quick map idea… —</option><option value="The ground floor of a roadside tavern: a common room with a long bar, round tables and a big stone hearth, a kitchen and pantry behind the bar, a cellar hatch, and stables against the east wall." data-genre="fantasy" data-setting="indoor">Roadside tavern</option><option value="A dirt road winding through dense forest, blocked by a fallen tree and an overturned merchant wagon. Boulders and thick undergrowth on both sides give cover, with a shallow stream crossing the road at the north end." data-genre="fantasy" data-setting="outdoor">Forest ambush road</option><option value="A stone crypt beneath a ruined chapel: a central hall lined with sarcophagi, two side vaults full of burial niches, a collapsed passage, and a sealed inner tomb behind an iron gate. Candles and braziers light the hall." data-genre="fantasy" data-setting="indoor">Crypt under the chapel</option><option value="A natural cave system with a narrow entrance tunnel, a large central cavern with a campfire and crude bedding, a side cave used as a pen, an underground pool, and a chieftain's nook on a raised ledge." data-genre="fantasy" data-setting="indoor">Goblin cave</option><option value="A harbour dock at the edge of town: two wooden piers with moored rowing boats, stacked crates and barrels, a cargo crane, a fishmonger's stall, and a large warehouse with wide double doors facing the water." data-genre="fantasy" data-setting="outdoor">Docks and warehouse</option><option value="A castle gatehouse and outer courtyard: a drawbridge over a moat, twin round towers, a portcullis passage, a guard room, and a cobbled courtyard with a well, a smithy lean-to and stacked siege supplies." data-genre="fantasy" data-setting="outdoor">Castle gatehouse</option><option value="A narrow mountain pass where a rope-and-plank bridge spans a deep chasm. A ruined watchtower stands on the near side, with scattered boulders, a cliff path and a small shrine on the far side." data-genre="fantasy" data-setting="outdoor">Mountain pass bridge</option><option value="A circular wizard's study at the top of a tower: curved bookshelves, a summoning circle inlaid in the floor, an alchemy bench, a telescope by a tall window, a spiral stair down, and glowing crystals for light." data-genre="fantasy" data-setting="indoor">Wizard's tower study</option><option value="The engine room of a small starship: a glowing reactor core in the centre ringed by a catwalk, coolant tanks, control consoles along the walls, a maintenance crawlway, and a sealed blast door to the main corridor." data-genre="sci-fi" data-setting="indoor">Starship engine room</option><option value="A derelict research lab on a space station: shattered specimen tanks, overturned lab benches, flickering consoles, a quarantine airlock, a storage bay, and emergency lighting strips along the floor." data-genre="sci-fi" data-setting="indoor">Abandoned space station lab</option><option value="A rain-slick city back alley at night between tall buildings: dumpsters, a fire escape, a parked delivery van, a noodle stand under a neon sign, stacked pallets, and a chain-link gate at the far end." data-genre="modern" data-setting="outdoor">Neon back alley</option><option value="A ruined roadside fuel station in a desert wasteland: rusted pumps under a collapsed canopy, a barricaded shop, wrecked cars arranged as a wall, a watch platform made of scrap, and a cracked highway running past." data-genre="post-apocalyptic" data-setting="outdoor">Wasteland fuel stop</option><option value="The entrance hall of a decaying manor: a grand staircase, a dusty chandelier fallen on the floor, covered furniture, a dining room with a long table, a study with a fireplace, and a locked door to the cellar." data-genre="horror" data-setting="indoor">Haunted manor hall</option></select><textarea id="map-description" name="description" rows="4" placeholder="A ruined riverside fortress with a broken bridge…"></textarea></div></section>
  <section class="map-section map-plan-section" aria-label="Layout plan">
    <div class="field"><label><input type="checkbox" name="autoPlan" checked> Plan the layout first</label></div>
    <details class="map-layout-plan" open><summary>Layout plan (free, editable)</summary><div class="field"><label for="map-layout">Edit the layout before drawing</label><textarea id="map-layout" name="layout" rows="5" maxlength="1200"></textarea></div></details>
  </section>
  <section class="map-section map-settings" aria-label="Map settings"><div class="field map-preset-field"><label for="map-preset">Style preset</label><div class="map-preset-row"><select id="map-preset" class="map-preset-select" aria-label="Style preset"></select><button type="button" class="map-preset-save" title="Save the current style settings as a preset">Save</button><button type="button" class="map-preset-delete" title="Delete this saved preset" disabled>Delete</button></div></div><div class="map-settings-grid">
    <div class="field"><label>Perspective</label><select name="perspective"><option value="top-down">Top-down</option><option value="isometric">Isometric</option><option value="three-quarter">Three-quarter</option></select></div>
    <div class="field"><label>Genre</label><select name="genre"><option value="fantasy">Fantasy</option><option value="sci-fi">Sci-fi</option><option value="modern">Modern</option><option value="horror">Horror</option><option value="post-apocalyptic">Post-apocalyptic</option><option value="steampunk">Steampunk</option><option value="other">Other</option></select><input name="genreOther" type="text" placeholder="Other genre" hidden></div>
    <div class="field"><label>Style</label><select name="style"><option value="painted">Painted</option><option value="hand-drawn ink">Hand-drawn ink</option><option value="realistic">Realistic</option><option value="cartoon">Cartoon</option><option value="other">Other</option></select><input name="styleOther" type="text" placeholder="Other style" hidden></div>
    <div class="field"><label>Mood</label><select name="mood"><option value="day">Day</option><option value="dusk">Dusk</option><option value="night">Night</option></select></div>
    <div class="field"><label>Width (squares)</label><input name="width" type="number" min="5" max="60" value="24"></div>
    <div class="field"><label>Height (squares)</label><input name="height" type="number" min="5" max="60" value="18"></div>
    <div class="field"><label>Setting</label><select name="setting"><option value="indoor">Indoor</option><option value="outdoor">Outdoor</option></select></div>
    <div class="field"><label>Weather effect</label><select name="weather"><option value="auto">Match the description</option><option value="none">None</option><option value="rain">Rain</option><option value="rainStorm">Rain storm</option><option value="snow">Snow</option><option value="blizzard">Blizzard</option><option value="fog">Fog</option><option value="leaves">Autumn leaves</option></select></div>
    <div class="field"><label>Quality</label><select name="quality"><option value="high">High detail (6 uses)</option><option value="standard" selected>Standard (6 uses)</option><option value="economy">Economy (4 uses)</option><option value="draft">Draft (2 uses)</option></select></div>
    <div class="field"><label>Mockups</label><select name="mockups"><option value="1">1 mockup (1 use)</option><option value="2">2 mockups (2 uses)</option><option value="4" selected>4 mockups (3 uses)</option></select></div>
  </div></section>
  <section class="map-section map-content-dials" aria-label="Map details"></section>
  <section class="map-section map-walls-option"><div class="field"><label><input type="checkbox" name="walls" checked> Integrated walls and lighting (+1 use)</label></div></section>
  <section class="map-section"><p class="map-cost" aria-live="polite">Mockups 3 uses + Standard final 6 uses + walls 1 use = 10 uses</p></section>
  <section class="map-section map-actions-section"><div class="form-actions"><button type="button" class="btn-secondary map-plan">Plan layout (free)</button><button type="button" class="btn-primary map-mockups">Generate mockups (3 uses)</button><button type="button" class="btn-secondary map-final" disabled>Make final map (6 uses)</button></div></section>
  <section class="map-section"><p class="map-status" role="status" aria-live="polite"></p><p class="map-error" role="alert" hidden></p></section>
  <section class="map-section map-mockup-section" aria-label="Mockups"><div class="map-thumbnails" aria-label="Choose a mockup"></div><p class="map-mockup-note" hidden>Earlier mockups stay here, so you can still pick one.</p></section>
  <section class="map-section map-result" aria-label="Final map" hidden>
    <p class="map-trace-counts"></p><p class="map-warning" hidden></p>
    <div class="map-preview-wrap"><canvas class="map-preview" aria-label="Finished battle map preview"></canvas><button type="button" class="map-zoom-btn map-preview-zoom" title="View larger" aria-label="View the map larger"><i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i></button></div>
    <div class="field map-trace-toggle"><label><input type="checkbox" name="showTrace" checked> Show walls, doors and lights on the preview</label></div><p class="map-saved" hidden></p>
    <div class="map-look-dials"></div><p class="map-measured"></p>
    <div class="map-scene-grid"><div class="field"><label>Scene width (squares)</label><input name="sceneWidth" type="number" min="1" max="200"></div><div class="field"><label>Scene height (squares)</label><input name="sceneHeight" type="number" min="1" max="200"></div></div>
    <button type="button" class="btn-primary map-create">Create scene</button>
  </section>
</form>
