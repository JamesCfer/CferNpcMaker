      <form class="npc-form" autocomplete="off">

        <div class="history-selected-banner" style="display:none;">
          <i class="fa-solid fa-arrow-turn-up fa-rotate-90"></i>
          <span class="history-selected-label">Editing prompt from <strong></strong> — update fields and Generate to recreate</span>
        </div>

        <div class="field-row">
          <div class="field field--name">
            <label for="npc-name">Item Name</label>
            <input type="text" id="npc-name" name="name" placeholder="e.g. Sunblade Longsword" />
          </div>
          <div class="field field--level">
            <label for="npc-level">Level</label>
            <input type="number" id="npc-level" name="level" value="1" min="0" max="25" step="1" />
          </div>
        </div>

        <div class="field">
          <label for="item-type">Item Type</label>
          <select id="item-type" name="itemType">
            <option value="weapon">Weapon</option>
            <option value="armor">Armor</option>
            <option value="shield">Shield</option>
            <option value="equipment" selected>Equipment / Worn</option>
            <option value="consumable">Consumable (potion, scroll, wand, oil…)</option>
            <option value="treasure">Treasure / Valuable</option>
            <option value="backpack">Container</option>
            <option value="book">Book</option>
          </select>
          <span class="field-hint">Determines the stat block shape used by the generated item.</span>
        </div>

        <div class="field">
          <label for="npc-desc">Description</label>
          <select class="desc-template-select" aria-label="Load a description template">
            <option value="">— Quick template… —</option>
            <option value="A rune-etched longsword whose blade glows faint blue in the presence of undead. Grants the wielder a +1 status bonus to attacks against undead and deals an extra 1d6 positive damage to them on a critical hit.">Holy blade</option>
            <option value="A travelling cloak woven from spider silk: grants the wearer a +2 item bonus to Stealth and allows them to climb sheer surfaces at half Speed without a check, once per day.">Spider-silk cloak</option>
            <option value="A ceramic flask that continuously fills with clean water. The water is purified of disease and mildly pleasant. Stopper it to halt the flow.">Endless water flask</option>
            <option value="A pair of burnished steel bracers engraved with storm runes. Once per day the wearer can activate them to cast lightning bolt as a 5th-level spell. The wearer is immune to electrical damage from the cast.">Storm bracers</option>
            <option value="A heavy amulet shaped like a serpent eating its own tail. Grants fast healing 2 while the wearer is below half HP. Cursed: the wearer cannot willingly drop below 1 HP and must make a Will save to retreat from combat.">Ouroboros amulet</option>
            <option value="A slim glass vial of shimmering silver liquid that catches the light like moonbeams. Drinking it is a single action; for 1 hour the imbiber gains low-light vision (or extends darkvision by 30 feet if they already have it) and a +1 item bonus to Perception checks that rely on sight. Consumable, magical, rarity common.">Moonlight elixir</option>
          </select>
          <textarea id="npc-desc" name="description" rows="6"
            placeholder="Describe this item: its appearance, powers, rarity, traits, history, activation cost, runes…"></textarea>
          <span class="field-hint">The more detail you provide, the better the AI can match your vision.</span>
        </div>

        <div class="form-actions">
          <button type="button" data-action="generate" class="btn-primary" disabled>
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span class="btn-label">Generate Item</span>
          </button>
          <button type="button" data-action="export" class="btn-secondary" disabled>
            <i class="fa-solid fa-file-arrow-down"></i>
            <span>Export JSON</span>
          </button>
        </div>

        <div class="form-actions form-actions--image">
          <button type="button" data-action="generateimage" class="btn-image" disabled>
            <i class="fa-solid fa-image"></i>
            <span>Generate Item Image</span>
            <span class="btn-cost-badge">4 uses</span>
          </button>
        </div>

      </form>
