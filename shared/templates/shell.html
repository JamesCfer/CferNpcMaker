<div class="npc-builder-layout">

  <!-- ── Tab strip (Home + this module's builder) ──────────────────────── -->
  <div class="builder-tabs" role="tablist">
    <button type="button" class="builder-tab builder-tab--home" data-tab="home"
            role="tab" id="builder-tab-home" aria-selected="false" aria-controls="builder-tabpanel-home">
      <i class="fa-solid fa-house"></i> Home
    </button>
    <div class="builder-tab-group">
      <button type="button" class="builder-tab builder-tab--builder" data-tab="builder"
              role="tab" id="builder-tab-builder" aria-selected="false" aria-controls="builder-tabpanel-builder">
        <i class="{{module.icon}}"></i> {{module.label}}
      </button>
      <a href="{{module.githubUrl}}" target="_blank" rel="noopener noreferrer" class="builder-tab-github" title="View on GitHub" aria-label="View module on GitHub">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
  </div>

  <!-- ── Home panel (links to all 4 modules) ──────────────────────────── -->
  <div class="home-panel" style="display:none;" role="tabpanel" id="builder-tabpanel-home" aria-labelledby="builder-tab-home">
    <!-- HOME_PANEL_INSERT -->
  </div>

  <!-- ── Offline detection banner ────────────────────────────────────── -->
  <div class="offline-banner" style="display:none;" role="status" aria-live="polite">
    <i class="fa-solid fa-wifi" aria-hidden="true"></i>
    <span>No network connection — generation is unavailable until you're back online.</span>
  </div>

  <!-- ── Main builder content ─────────────────────────────────────────── -->
  <div class="builder-inner" role="tabpanel" id="builder-tabpanel-builder" aria-labelledby="builder-tab-builder">

    <!-- Left: form panel -->
    <div class="npc-panel-form">

      <!-- Auth banner -->
      <div class="auth-banner">
        <div class="auth-unsigned">
          <div class="auth-unsigned-text">
            <i class="fa-brands fa-patreon auth-patreon-icon"></i>
            <span>Sign in with Patreon to use this module</span>
          </div>
          <div class="auth-unsigned-actions">
            <button type="button" data-action="signin" class="btn-patreon">
              <i class="fa-brands fa-patreon"></i> Sign in with Patreon
            </button>
            <button type="button" data-action="patreon" class="btn-join">
              Join Patreon
            </button>
          </div>
        </div>
        <div class="auth-signed">
          <div class="auth-signed-status">
            <i class="fa-solid fa-circle-check"></i>
            <span>Signed in via Patreon</span>
            <span class="auth-uses" role="status" aria-live="polite" hidden></span>
          </div>
          <button type="button" data-action="signout" class="btn-signout">
            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
          </button>
        </div>
      </div>

      <!-- Module-specific form -->
      <!-- FORM_INSERT -->

      <div class="post-gen-actions">
        <button type="button" data-action="undolast" class="btn-undo" disabled>
          <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
          <span>Undo Last Generation</span>
        </button>
      </div>
    </div>

    <!-- Right: history panel -->
    <div class="npc-panel-history">
      <div class="history-header">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span class="history-header-label">{{module.historyLabel}}</span>
        <button type="button" class="history-compact-btn" title="Collapse history panel" aria-pressed="false" aria-label="Toggle compact history panel">
          <i class="fa-solid fa-angles-right"></i>
        </button>
        <button type="button" class="history-clear-btn" data-action="clearhistory" title="Clear all history entries">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
      <div class="history-search">
        <input type="text" class="history-search-input" placeholder="Filter by name…" aria-label="Filter history by name">
      </div>
      <div class="history-list"></div>
    </div>

  </div>

  <!-- ── Feedback section ─────────────────────────────────────────────── -->
  <div class="feedback-section">
    <div class="feedback-header">
      <i class="fa-solid fa-comment-dots"></i>
      <span>Send Feedback</span>
    </div>
    <div class="feedback-body">
      <textarea class="feedback-textarea" placeholder="Found a bug? Have a suggestion? Let us know…" rows="2"></textarea>
      <button type="button" data-action="sendfeedback" class="feedback-send-btn">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Send</span>
      </button>
    </div>
    <div class="feedback-status" style="display:none;"></div>
  </div>

</div>
